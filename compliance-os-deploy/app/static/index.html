<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CompOS — Compliance Operating System</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%231d4ed8%22/%3E%3C/svg%3E">
  <style>
    :root{--bg:#0b1220;--panel:#111827;--line:#243044;--text:#e5eef8;--muted:#94a3b8;--blue:#1d4ed8;--green:#14532d;--amber:#78350f;--red:#7f1d1d;--purple:#4c1d95;--gray:#1f2937}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
    a{color:#93c5fd}
    .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{background:#0f172a;border-right:1px solid var(--line);padding:16px 10px;overflow:auto;position:sticky;top:0;height:100vh}
    .brand{font-weight:800;padding:6px 10px 4px}.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
    .nav-section{margin:14px 10px 6px;font-size:11px;letter-spacing:.08em;color:#64748b;text-transform:uppercase}
    .nav-item{padding:9px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-size:13px;margin-bottom:2px;display:flex;justify-content:space-between}.nav-item:hover{background:#1e293b;color:var(--text)}.nav-item.active{background:var(--blue);color:#fff}
    .nav-item .count{background:#334155;color:#e2e8f0;border-radius:99px;padding:0 7px;font-size:11px}
    .main{padding:18px 22px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
    h1{font-size:20px;margin:0}h2,h3{margin:0 0 12px}h3{font-size:15px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.card .label{color:var(--muted);font-size:12px}.card .value{font-size:24px;font-weight:700;margin-top:6px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;overflow-x:auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-weight:500;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
    td{padding:8px;border-bottom:1px solid #1c2941;vertical-align:top;word-break:break-word}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
    .b-green{background:var(--green);color:#bbf7d0}.b-amber{background:var(--amber);color:#fde68a}.b-red{background:var(--red);color:#fecaca}.b-blue{background:#1e3a8a;color:#bfdbfe}.b-gray{background:var(--gray);color:#d1d5db}.b-purple{background:var(--purple);color:#ddd6fe}
    .btn{white-space:nowrap;background:var(--blue);border:0;color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer}.btn:hover{background:#1e40af}.btn:disabled{opacity:.5;cursor:wait}.btn.ghost{background:var(--gray);color:var(--text)}.btn.danger{background:#b91c1c}.btn.small{padding:5px 8px;font-size:11px;margin:2px 4px 2px 0}
    input,select,textarea{background:#0b1220;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;font-size:13px;min-width:140px;font-family:inherit}textarea{min-width:320px;min-height:80px}
    .form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.muted{color:var(--muted);font-size:12px}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#93c5fd;margin:0}
    .toast{position:fixed;right:18px;bottom:18px;background:var(--green);color:#dcfce7;padding:10px 14px;border-radius:10px;display:none;z-index:60;font-size:13px;max-width:480px}.toast.err{background:#7f1d1d;color:#fecaca}
    .drawer{position:fixed;top:0;right:-720px;width:700px;max-width:95vw;height:100vh;background:#0f172a;border-left:1px solid var(--line);transition:right .25s ease;z-index:50;padding:18px;overflow:auto}.drawer.open{right:0}
    .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .connector-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
    .banner{background:#1e293b;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--muted)}.banner b{color:var(--text)}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot.on{background:#22c55e}.dot.off{background:#64748b}.dot.err{background:#ef4444}
    .md{white-space:pre-wrap;font-size:13px;line-height:1.5;color:var(--text)}
    @media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}.grid2{grid-template-columns:1fr}textarea{min-width:0;width:100%}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1 id="title">Command Center</h1><div class="muted" id="subtitle"></div></div>
      <div class="form-row" style="margin:0">
        <span class="muted" id="conn-state"><span class="dot off"></span>connecting…</span>
        <button class="btn ghost" onclick="refresh()">Refresh</button>
        <a class="btn ghost" href="/docs" target="_blank" style="text-decoration:none">API Docs</a>
      </div>
    </div>
    <div id="content"><div class="panel muted">Loading…</div></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><h3 id="drawer-title">Output</h3><button class="btn small ghost" onclick="closeDrawer()">Close</button></div>
  <div id="drawer-body"></div>
</div>

<script>
// ------------------------------------------------------------------ API client
const KEY_STORE = "compos_api_key";
function apiKey(){ try{ return localStorage.getItem(KEY_STORE)||""; }catch(e){ return ""; } }
async function api(method, path, body){
  const headers = {"Content-Type":"application/json"};
  const k = apiKey(); if(k) headers["X-API-Key"] = k;
  const res = await fetch(path, {method, headers, body: body===undefined?undefined:JSON.stringify(body)});
  if(res.status===401){
    const key = prompt("This CompOS server requires an API key (X-API-Key):");
    if(key){ try{ localStorage.setItem(KEY_STORE, key); }catch(e){} return api(method, path, body); }
  }
  let data = null; try{ data = await res.json(); }catch(e){}
  if(!res.ok){ const d = data && data.detail; throw new Error(typeof d === "string" ? d : JSON.stringify(d || data || res.statusText)); }
  return data;
}

let DB = null;
let screen = (location.hash||"#dashboard").slice(1);
let selected = {questionnaire:null, dsar:null, auditorDsar:null, incident:null};
let chains = {};

async function refresh(){
  try{
    DB = await api("GET","/v1/state");
    document.getElementById("conn-state").innerHTML = `<span class="dot on"></span>connected · ${esc(DB.status.database)}`;
    for(const k of ["dsar","auditorDsar"]) if(selected[k]) chains[selected[k]] = await api("GET",`/v1/dsar/${selected[k]}/chain`).catch(()=>null);
    render();
  }catch(e){
    document.getElementById("conn-state").innerHTML = `<span class="dot err"></span>offline`;
    document.getElementById("content").innerHTML = `<div class="panel"><h3>Cannot reach the CompOS API</h3><pre>${esc(e.message)}</pre></div>`;
  }
}

async function act(label, fn, opts={}){
  const btns=[...document.querySelectorAll("button")]; btns.forEach(b=>b.disabled=true);
  try{
    const r = await fn();
    toast(typeof label==="function"?label(r):label);
    await refresh();
    if(opts.show) show(r, opts.title);
    return r;
  }catch(e){ toast(e.message, true); }
  finally{ btns.forEach(b=>b.disabled=false); }
}

// ------------------------------------------------------------------ helpers
function val(id){ const el=document.getElementById(id); return el?el.value.trim():""; }
function toast(m, err){ const t=document.getElementById("toast"); t.textContent=m; t.className="toast"+(err?" err":""); t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", err?7000:3000); }
function show(o, title){ document.getElementById("drawer-title").textContent=title||"Output"; document.getElementById("drawer-body").innerHTML=`<pre>${esc(JSON.stringify(o,null,2))}</pre>`; document.getElementById("drawer").classList.add("open"); }
function showHtml(html, title){ document.getElementById("drawer-title").textContent=title||"Output"; document.getElementById("drawer-body").innerHTML=html; document.getElementById("drawer").classList.add("open"); }
function closeDrawer(){ document.getElementById("drawer").classList.remove("open"); }
function esc(v){ return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
function fmt(v){ if(v==null)return "—"; const s=typeof v==="object"?JSON.stringify(v):String(v); return s.length>140?s.slice(0,140)+"…":s; }
function shortId(v){ return v?String(v).slice(0,16):"—"; }
function when(v){ return v?new Date(v).toLocaleString():"—"; }
function safeUrl(u){ return /^https?:\/\//i.test(u||"")?u:"#"; }
function link(u){ return u?`<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">Open</a>`:"—"; }
function badge(v){ const map={active:"b-blue",approved:"b-green",accepted:"b-green",rejected:"b-red",pass:"b-green",fail:"b-red",missing_evidence:"b-amber",open:"b-red",resolved:"b-green",done:"b-green",closed:"b-gray",pending_review:"b-amber",collected:"b-blue",imported:"b-blue",in_review:"b-amber",draft:"b-amber",draft_ready_auto:"b-green",draft_ready_review:"b-amber",needs_source:"b-red",received:"b-blue",in_progress:"b-amber",completed:"b-green",pending:"b-amber",signed:"b-green",detected:"b-amber",ingested:"b-blue",impact_analyzed:"b-purple",pending_triage:"b-amber",pending_legal_review:"b-purple",triaged:"b-blue",assessed:"b-green",planned:"b-green",new:"b-gray",high:"b-red",medium:"b-amber",low:"b-green",critical:"b-red",success:"b-green",error:"b-red",info:"b-blue",warning:"b-amber",true:"b-green",false:"b-gray",enabled:"b-green",disabled:"b-gray",neutral:"b-blue",negative:"b-red",positive:"b-green",live:"b-green",manual:"b-purple",upload:"b-purple",demo:"b-gray",workflow:"b-blue",heuristic:"b-amber",template:"b-amber",rss:"b-blue",federal_register:"b-green"}; const k=String(v).toLowerCase(); return `<span class="badge ${map[k]||"b-gray"}">${esc(String(v).replaceAll("_"," ").toUpperCase())}</span>`; }
function table(cols, rows){ return `<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.join(""):`<tr><td colspan="${cols.length}" class="muted">No records.</td></tr>`}</tbody></table>`; }
function find(coll,id){ return (DB[coll]||[]).find(x=>x.id===id); }
function showObj(coll,id){ show(find(coll,id)||{error:"Not found"}); }

// ------------------------------------------------------------------ navigation
const NAV = [
 {section:"Overview",items:[{id:"dashboard",label:"Command Center"},{id:"integrations",label:"Integrations"}]},
 {section:"Compliance Foundation",items:[{id:"frameworks",label:"Framework Mappings"},{id:"controls",label:"Controls"},{id:"evidence",label:"Evidence Vault"},{id:"tests",label:"Control Tests"},{id:"gaps",label:"Gaps",count:()=>DB.metrics.open_gaps}]},
 {section:"AI Workflows",items:[{id:"policies",label:"Policy AI"},{id:"questionnaires",label:"Questionnaire AI"}]},
 {section:"Privacy & Audit",items:[{id:"privacy",label:"GDPR DSAR"},{id:"auditor",label:"Auditor Portal"}]},
 {section:"Risk & Operations",items:[{id:"incidents",label:"Incident Response"},{id:"breach",label:"Breach Matrix"},{id:"radar",label:"State Regulatory Radar"},{id:"review",label:"Expert Review",count:()=>DB.reviewItems.filter(r=>r.status==="pending_triage").length},{id:"vendors",label:"Vendor Risk"},{id:"trust",label:"Trust Center"}]},
 {section:"Global Intelligence",items:[{id:"globalRadar",label:"Global Radar"},{id:"legalAI",label:"Legal AI"},{id:"marketIntel",label:"Market Intelligence"},{id:"implementationPlans",label:"Implementation Plans"}]},
 {section:"Platform",items:[{id:"reports",label:"Executive Reporting"},{id:"mcp",label:"MCP / Developer"},{id:"brain",label:"Neuralink Brain"},{id:"pricing",label:"Pricing Entitlements"}]}
];
const META = {dashboard:["Command Center","Operational overview"],integrations:["Integrations","Live connectors, search and LLM providers"],frameworks:["Framework Mappings","SOC 2 / ISO / HIPAA / GDPR"],controls:["Controls","Control catalog"],evidence:["Evidence Vault","SHA-256 hashed, immutable evidence"],tests:["Control Tests","Automated tests against the latest evidence"],gaps:["Gaps","Gap and remediation (auto-resolved when tests pass)"],policies:["Policy AI","Policy generation and versioning"],questionnaires:["Questionnaire AI","Answer-library retrieval + LLM drafting"],privacy:["GDPR DSAR","DSAR workflow and evidence chain"],auditor:["Auditor Portal","Read-only evidence chain"],incidents:["Incident Response","Breach-matrix triage with notice deadlines"],breach:["Breach Matrix","50-state notification matrix (validate with counsel)"],radar:["State Regulatory Radar","Breach-law change detection"],review:["Expert Review","Unified review queue"],vendors:["Vendor Risk","Vendor inventory and scored assessments"],trust:["Trust Center","Trust documents and NDAs"],globalRadar:["Global Radar","Federal Register API + regulator search"],legalAI:["Legal AI","Obligation extraction from legal text"],marketIntel:["Market Intelligence","Regulator press and enforcement feeds"],implementationPlans:["Implementation Plans","Phased 0–30 / 30–90 / 90–180 day plans"],reports:["Executive Reporting","Board-ready readiness reports"],mcp:["MCP / Developer","Tool calls over the API"],brain:["Neuralink Brain","Telemetry and tracing"],pricing:["Pricing Entitlements","Module gating"]};

function buildSidebar(){ let h=`<div class="brand">🧠 CompOS<small>v${esc(DB?.status?.version||"")}</small></div>`; NAV.forEach(s=>{ h+=`<div class="nav-section">${esc(s.section)}</div>`; s.items.forEach(i=>{ const c=i.count&&DB?i.count():0; h+=`<div class="nav-item ${i.id===screen?"active":""}" onclick="go('${i.id}')"><span>${esc(i.label)}</span>${c?`<span class="count">${c}</span>`:""}</div>`; }); }); document.getElementById("sidebar").innerHTML=h; }
function go(s){ screen=s; location.hash=s; render(); window.scrollTo(0,0); }
function render(){ if(!DB)return; buildSidebar(); const m=META[screen]||META.dashboard; if(!SCREENS[screen])screen="dashboard"; document.getElementById("title").textContent=m[0]; document.getElementById("subtitle").textContent=m[1]; document.getElementById("content").innerHTML=providerBanner()+SCREENS[screen](); }
function providerBanner(){ const s=DB.status; if(!["globalRadar","legalAI","marketIntel","policies","questionnaires","radar"].includes(screen))return ""; return `<div class="banner">Search: <b>${esc(s.search_provider)}</b> ${s.search_live?"(live)":"(not configured)"} · LLM: <b>${esc(s.llm_provider)}</b> ${s.llm_live?"(live)":"(not configured — rule-based fallback)"} · Federal Register: <b>${esc(s.federal_register)}</b> · <a href="#" onclick="go('integrations');return false">configure</a></div>`; }

// ------------------------------------------------------------------ actions
const runConnector = n => act(r=>`${n.toUpperCase()}: ${r.evidence.length} evidence record(s) collected`, ()=>api("POST",`/v1/connectors/${n}/run`), {show:true, title:`${n} evidence`});
const testConnector = n => act(r=>`${n}: ${r.ok?"connection OK":"connection failed"}`, ()=>api("POST",`/v1/connectors/${n}/test`), {show:true, title:`${n} connection test`});
function uploadHr(){ const f=document.getElementById("hr-file").files[0]; if(!f){toast("Choose a CSV file",true);return;} f.text().then(csv=>act("HR roster uploaded", ()=>api("POST","/v1/connectors/hr/upload",{csv, filename:f.name}), {show:true,title:"HR evidence"})); }
function attestEvidence(){ let payload; try{ payload=JSON.parse(val("att-payload")); }catch(e){ toast("Payload must be valid JSON",true); return; } act("Evidence attested", ()=>api("POST","/v1/evidence",{control_id:val("att-control"), payload, attested_by:val("att-by"), note:val("att-note")})); }
const runTest = id => act(r=>`Test result: ${r.status}`, ()=>api("POST",`/v1/tests/${id}/run`));
const runAllTests = () => act(r=>`${r.filter(x=>x.status==="pass").length}/${r.length} tests passing`, ()=>api("POST","/v1/tests/run-all"));
const evidenceAction = (id,a) => act(`Evidence ${a}d`, ()=>api("POST",`/v1/evidence/${id}/${a}`));
const verifyEvidence = id => act(r=>r.verifiable?(r.hash_matches?"Hash verified ✓":"HASH MISMATCH"):"Not verifiable", ()=>api("GET",`/v1/evidence/${id}/verify`), {show:true,title:"Integrity check"});
function addControl(){ act("Control created", ()=>api("POST","/v1/controls",{code:val("c-code"),title:val("c-title"),category:val("c-cat"),risk_level:val("c-risk")})); }
function addTest(){ let ev=val("t-exp"); try{ ev=JSON.parse(ev); }catch(e){} act("Test created", ()=>api("POST","/v1/tests",{control_id:val("t-control"),name:val("t-name"),expected_field:val("t-field"),operator:val("t-op"),expected_value:ev})); }
const updateRemediation = (id,status) => act("Remediation updated", ()=>api("POST",`/v1/remediation/${id}`,{status, owner:prompt("Owner (leave blank to keep):")||undefined}));
function generatePolicy(){ act(r=>`Policy drafted (${r.provider})`, ()=>api("POST","/v1/policies/generate",{company:val("pol-company")||"The Company", policy_type:val("pol-type")||"information security"})); }
async function showPolicyVersions(id){ try{ const vs=await api("GET",`/v1/policies/${id}/versions`); showHtml(vs.map(v=>`<div class="panel"><div class="form-row">${badge(v.status)} <b>v${esc(v.version)}</b> <span class="muted">${esc(v.provider||"")} · ${when(v.created_at)}</span></div><div class="md">${esc(v.content)}</div></div>`).join("")||"No versions", "Policy versions"); }catch(e){ toast(e.message,true); } }
const approvePolicy = id => act("Policy approved", ()=>api("POST",`/v1/policies/${id}/approve`));
function importQuestionnaire(){ act("Questionnaire imported", ()=>api("POST","/v1/questionnaires",{customer:val("q-customer")||"Customer", questions:val("q-questions")})); }
const processQuestionnaire = id => { selected.questionnaire=id; return act(r=>`Processed: ${r.questionnaire.auto_answered} auto, ${r.questionnaire.needs_review} for review`, ()=>api("POST",`/v1/questionnaires/${id}/process`)); };
const answerFeedback = (id,type) => act(`Answer ${type}`, ()=>api("POST","/v1/questionnaires/feedback",{answer_id:id, feedback_type:type}));
function addLibrary(){ act("Added to answer library", ()=>api("POST","/v1/answer-library",{question:val("al-q"),answer:val("al-a")})); }
function startDsar(){ act(r=>{ selected.dsar=r.dsar.id; return "DSAR started"; }, ()=>api("POST","/v1/dsar/start",{requester_email:val("dsar-email"), request_type:val("dsar-type")})); }
const advanceDsar = id => { selected.dsar=id; return act(r=>`DSAR advanced (${r.completed_steps.length}/10)`, ()=>api("POST",`/v1/dsar/${id}/advance`,{note:prompt("Completion note for this step (optional):")||undefined})); };
function selectDsar(key,id){ selected[key]=id; refresh(); }
function createIncident(){ act("Incident created", ()=>api("POST","/v1/incidents",{title:val("inc-title"), severity:val("inc-sev"), affected_states:val("inc-states").split(/[ ,]+/).filter(Boolean), records_affected:Number(val("inc-records"))||null})); }
const triageIncident = id => { selected.incident=id; return act("Incident triaged", ()=>api("POST",`/v1/incidents/${id}/triage`)); };
const crawlRadar = () => act(r=>`${r.created.length} update(s) found${r.errors.length?`, ${r.errors.length} error(s)`:""}`, ()=>api("POST","/v1/reg-radar/crawl",{}));
function manualUpdate(){ act("Update recorded", ()=>api("POST","/v1/reg-radar/updates",{state_code:val("ru-state"), title:val("ru-title"), url:val("ru-url"), individual_days:val("ru-days")||null, regulator_threshold:val("ru-threshold")||null})); }
const analyzeUpdate = id => act(r=>r.status==="needs_analyst_input"?"Queued for analyst input":"Proposal created for legal review", ()=>api("POST",`/v1/reg-radar/${id}/analyze`));
const reviewDecision = (id,d) => act(`Review item ${d}`, ()=>api("POST",`/v1/review-items/${id}/${d==="approved"?"approve":"reject"}`));
function createVendor(){ act("Vendor added", ()=>api("POST","/v1/vendors",{name:val("v-name"),category:val("v-cat"),risk_tier:val("v-tier"),data_access:val("v-data"),has_soc2:val("v-soc2")==="yes"})); }
const assessVendor = id => act(r=>`Risk score ${r.risk_score}`, ()=>api("POST",`/v1/vendors/${id}/assess`,{}));
function createTrustDoc(){ act("Trust document created", ()=>api("POST","/v1/trust-documents",{title:val("trust-title"),access_level:val("trust-access"),url:val("trust-url")})); }
function requestNda(){ act("NDA request logged", ()=>api("POST","/v1/nda-requests",{company:val("nda-company"),requester_email:val("nda-email")})); }
const signNda = id => act("NDA signed", ()=>api("POST",`/v1/nda-requests/${id}/sign`));
const generateReport = () => act(r=>`Readiness ${r.payload.overall_readiness_score}%`, ()=>api("POST","/v1/reports/generate"), {show:true,title:"Executive report"});
const syncGlobalRadar = () => act(r=>`Global radar: ${r.documents_created} new doc(s), ${Object.keys(r.errors).length} source error(s)`, ()=>api("POST","/v1/global-radar/sync",{max_per_source:5}), {show:true,title:"Global radar sync"});
async function globalSearch(){ const q=val("gs-query"); if(!q){toast("Enter a query",true);return;} await act("Search complete", ()=>api("POST","/v1/global-radar/search",{query:q,max_results:8}), {show:true,title:"Search results"}); }
const queueRuleChange = id => act("Queued for expert review", ()=>api("POST",`/v1/rule-changes/${id}/review`));
function analyzeRuleChange(id){ const c=find("ruleChanges",id); if(c) analyzeUrl(c.url, c.title, (c.jurisdictions||[])[0]||""); }
function analyzeUrl(url, title, jurisdiction){ go("legalAI"); act(r=>`Legal AI analysis complete (${r.analysis.provider})`, ()=>api("POST","/v1/legal/documents",{source_url:url, title, jurisdiction, doc_type:"regulation"}), {show:true,title:"Legal analysis"}); }
function uploadLegal(){ act(r=>`Legal AI analysis complete (${r.analysis.provider})`, ()=>api("POST","/v1/legal/documents",{title:val("legal-title")||undefined, doc_type:val("legal-type"), jurisdiction:val("legal-jurisdiction"), text:val("legal-text"), source_url:val("legal-url")||undefined}), {show:true,title:"Legal analysis"}); }
const generatePlan = id => act(r=>`${r.length} plan phase(s) created`, ()=>api("POST",`/v1/implementation/plans/generate/${id}`));
const syncMarket = () => act(r=>`Market: ${r.signals_created} new signal(s), ${Object.keys(r.errors).length} feed error(s)`, ()=>api("POST","/v1/market/sync",{}), {show:true,title:"Market sync"});
async function callMcp(){ let args={}; try{ const raw=val("mcp-args"); args=raw?JSON.parse(raw):{}; }catch(e){ toast("Arguments must be valid JSON",true); return; } await act("Tool executed", ()=>api("POST","/v1/mcp/call",{tool:val("mcp-tool"),arguments:args}), {show:true,title:"MCP result"}); }
async function openFlow(id){ try{ show(await api("GET",`/v1/brain/flows/${id}`),"Trace "+id); }catch(e){ toast(e.message,true); } }
const toggleEntitlement = (id,en) => act("Entitlement updated", ()=>api("POST",`/v1/pricing/entitlements/${id}`,{enabled:en}));
async function editSource(id){ const s=find("regulatorySources",id); const feed=prompt(`RSS/Atom feed URL for ${s.body_name} (blank to clear):`, s.feed_url||""); if(feed===null)return; const fr=prompt(`Federal Register agency slug (US only, blank to clear):`, s.federal_register_agency||""); if(fr===null)return; act("Source updated", ()=>api("PATCH",`/v1/objects/global_rule_source/${id}`,{feed_url:feed||null, federal_register_agency:fr||null})); }

function renderDashboard(){ const m=DB.metrics; const report=DB.reports[0]; const cards=[["Controls",m.control],["Evidence",m.evidence],["Open Gaps",m.open_gaps],["Readiness",report?report.payload.overall_readiness_score+"%":"—"],["Policies",m.policy],["DSARs",m.dsar],["Incidents",m.incident],["Rule Changes",m.rule_change],["Market Signals",m.market_signal],["Legal Analyses",m.legal_analysis]].map(([k,v])=>`<div class="card"><div class="label">${esc(k)}</div><div class="value">${esc(v)}</div></div>`).join("");
  const rows=DB.events.slice(0,12).map(e=>`<tr><td>${new Date(e.created_at).toLocaleTimeString()}</td><td>${esc(e.flow)}</td><td>${esc(e.step)}</td><td>${badge(e.status)}</td><td><button class="btn small ghost" onclick="openFlow('${esc(e.correlation_id)}')">Trace</button></td></tr>`);
  const conns=DB.status.connectors.map(c=>`<div style="font-size:13px;margin-bottom:6px"><span class="dot ${c.configured?"on":"off"}"></span>${esc(c.name)} <span class="muted">${c.configured?"configured":"not configured"}</span></div>`).join("");
  return `<div class="cards">${cards}</div><div class="panel"><h3>Quick Actions</h3><div class="form-row"><button class="btn" onclick="runConnector('aws')">Run AWS</button><button class="btn ghost" onclick="runConnector('okta')">Run Okta</button><button class="btn ghost" onclick="runConnector('github')">Run GitHub</button><button class="btn ghost" onclick="runAllTests()">Run All Tests</button><button class="btn ghost" onclick="syncGlobalRadar()">Sync Global Radar</button><button class="btn ghost" onclick="syncMarket()">Sync Market Intel</button><button class="btn ghost" onclick="generateReport()">Generate Report</button></div></div>
  <div class="grid2"><div class="panel"><h3>Neuralink Activity</h3>${table(["Time","Flow","Step","Status","Trace"],rows)}</div><div class="panel"><h3>Integrations</h3>${conns}<div style="margin-top:10px" class="muted">Search: ${esc(DB.status.search_provider)} · LLM: ${esc(DB.status.llm_provider)}</div><h3 style="margin-top:16px">Brain Anomaly Detection</h3><pre>${esc(JSON.stringify(DB.anomalies,null,2))}</pre></div></div>`; }

function renderIntegrations(){ const s=DB.status;
  const conns=s.connectors.map(c=>`<div class="card"><h3><span class="dot ${c.configured?"on":"off"}"></span>${esc(c.name)}</h3><p class="muted">${esc(c.description)}</p><p class="muted">Controls: ${esc(c.controls.join(", "))}</p>${c.env.length?`<p class="muted">Env: <code>${c.env.map(esc).join("</code>, <code>")}</code></p>`:""}${c.missing.length?`<p class="muted" style="color:#fca5a5">Missing: ${esc(c.missing.join(", "))}</p>`:""}${c.upload_only?`<input type="file" id="hr-file" accept=".csv,text/csv" style="min-width:0;width:100%;margin-bottom:8px"><button class="btn" onclick="uploadHr()">Upload CSV</button>`:`<button class="btn" onclick="runConnector('${c.id}')" ${c.configured?"":"disabled"}>Collect Evidence</button><button class="btn ghost" onclick="testConnector('${c.id}')" ${c.configured?"":"disabled"}>Test Connection</button>`}</div>`).join("");
  const controlOpts=DB.controls.map(c=>`<option value="${esc(c.id)}">${esc(c.id)} — ${esc(c.title)}</option>`).join("");
  return `<div class="panel"><h3>Evidence Connectors</h3><div class="muted" style="margin-bottom:12px">Credentials are read from server environment variables (<code>.env</code>). Restart the container after changing them.</div><div class="connector-grid">${conns}</div></div>
  <div class="panel"><h3>Attest Manual Evidence</h3><div class="muted" style="margin-bottom:8px">For controls no API can observe, e.g. backup restore tests: <code>{"backup_restore_test":"completed"}</code></div><div class="form-row"><select id="att-control">${controlOpts}</select><input id="att-by" placeholder="Attested by"><input id="att-note" placeholder="Note / ticket link" style="min-width:240px"></div><textarea id="att-payload" style="width:100%" placeholder='{"backup_restore_test":"completed"}'></textarea><div class="form-row" style="margin-top:8px"><button class="btn" onclick="attestEvidence()">Attest</button></div></div>
  <div class="grid2"><div class="panel"><h3>Intelligence Providers</h3>${table(["Provider","Setting","Status"],[`<tr><td>Federal Register API</td><td>keyless</td><td>${badge("enabled")}</td></tr>`,`<tr><td>Internet search</td><td><code>SEARCH_PROVIDER=${esc(s.search_provider)}</code></td><td>${badge(s.search_live?"live":"disabled")}</td></tr>`,`<tr><td>LLM</td><td><code>LLM_PROVIDER</code> → ${esc(s.llm_provider)}</td><td>${badge(s.llm_live?"live":"disabled")}</td></tr>`,`<tr><td>Scheduled sync</td><td><code>RADAR_SYNC_INTERVAL_HOURS=${esc(s.scheduler_hours)}</code></td><td>${badge(s.scheduler_hours>0?"enabled":"disabled")}</td></tr>`,`<tr><td>API auth</td><td><code>AUTH_ENABLED</code></td><td>${badge(s.auth_enabled?"enabled":"disabled")}</td></tr>`])}</div>
  <div class="panel"><h3>Setup</h3><pre>cp .env.example .env    # add credentials
docker compose up --build
# then open http://localhost:8000</pre></div></div>`; }

function renderFrameworks(){ const rows=DB.mappings.map(m=>{ const c=find("controls",m.control_id)||{}; const f=find("frameworks",m.framework_id)||{}; return `<tr><td><b>${esc(c.id||m.control_id)}</b></td><td>${esc(c.title||"—")}</td><td>${esc(c.category||"—")}</td><td>${esc(f.code||m.framework_id)}</td><td>${esc(f.name||"—")}</td><td>${esc(m.requirement||"—")}</td></tr>`; }); return `<div class="panel"><h3>Unified Control Framework Mappings</h3>${table(["Control","Title","Category","Framework","Name","Requirement"],rows)}</div>`; }

function renderControls(){ const latest={}; DB.testRuns.forEach(r=>{ if(!latest[r.control_id])latest[r.control_id]=r; }); const rows=DB.controls.map(c=>`<tr><td><b>${esc(c.id)}</b></td><td>${esc(c.title)}</td><td>${esc(c.category)}</td><td>${badge(c.risk_level)}</td><td>${latest[c.id]?badge(latest[c.id].status):'<span class="muted">not tested</span>'}</td><td>${DB.evidence.filter(e=>e.control_id===c.id).length}</td></tr>`); return `<div class="panel"><h3>Create Control</h3><div class="form-row"><input id="c-code" placeholder="Code e.g. BCP-001"><input id="c-title" placeholder="Title" style="min-width:260px"><input id="c-cat" placeholder="Category"><select id="c-risk"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="critical">Critical</option></select><button class="btn" onclick="addControl()">Add</button></div></div><div class="panel"><h3>Catalog</h3>${table(["Code","Title","Category","Risk","Latest Test","Evidence"],rows)}</div>`; }

function renderEvidence(){ const rows=DB.evidence.map(e=>`<tr><td class="mono">${esc(shortId(e.id))}</td><td>${esc(e.connector)}</td><td>${badge(e.source||"demo")}</td><td>${esc(e.control_id||"—")}</td><td>${esc(fmt(e.payload))}</td><td>${esc(e.quality_score)}</td><td>${badge(e.status)}</td><td class="muted">${esc(String(e.hash||"").slice(0,12))}</td><td>${e.status!=="approved"&&e.status!=="rejected"?`<button class="btn small" onclick="evidenceAction('${e.id}','approve')">Approve</button><button class="btn small danger" onclick="evidenceAction('${e.id}','reject')">Reject</button>`:""}<button class="btn small ghost" onclick="verifyEvidence('${e.id}')">Verify</button><button class="btn small ghost" onclick="showObj('evidence','${e.id}')">View</button></td></tr>`); return `<div class="panel"><h3>Evidence Vault</h3><div class="muted" style="margin-bottom:8px">Collect evidence from <a href="#" onclick="go('integrations');return false">Integrations</a>. Records are hashed at collection and cannot be deleted.</div>${table(["ID","Connector","Source","Control","Payload","Quality","Status","Hash","Actions"],rows)}</div>`; }

function renderTests(){ const tr=DB.tests.map(t=>`<tr><td>${esc(t.id)}</td><td><b>${esc(t.name)}</b></td><td>${esc(t.control_id)}</td><td>${esc(t.expected_field)}</td><td>${esc(t.operator)}</td><td>${esc(fmt(t.expected_value))}</td><td><button class="btn small" onclick="runTest('${t.id}')">Run</button></td></tr>`); const rr=DB.testRuns.map(r=>`<tr><td>${when(r.created_at)}</td><td>${esc(r.test_id)}</td><td>${badge(r.status)}</td><td>${esc(fmt(r.result))}</td></tr>`); const controlOpts=DB.controls.map(c=>`<option value="${esc(c.id)}">${esc(c.id)}</option>`).join("");
  return `<div class="panel"><h3>Tests</h3><div class="form-row"><button class="btn" onclick="runAllTests()">Run All Tests</button></div>${table(["ID","Name","Control","Field","Op","Expected","Actions"],tr)}</div><div class="panel"><h3>Add Test</h3><div class="form-row"><select id="t-control">${controlOpts}</select><input id="t-name" placeholder="Name"><input id="t-field" placeholder="Evidence field"><select id="t-op"><option>eq</option><option>neq</option><option>exists</option><option>gte</option><option>lte</option><option>eq_field</option></select><input id="t-exp" placeholder='Expected (JSON or field name)'><button class="btn" onclick="addTest()">Add</button></div></div><div class="panel"><h3>Test Runs</h3>${table(["Time","Test","Status","Result"],rr)}</div>`; }

function renderGaps(){ const gr=DB.gaps.map(g=>`<tr><td>${esc(shortId(g.id))}</td><td><b>${esc(g.title)}</b></td><td>${esc(g.control_id)}</td><td>${badge(g.severity)}</td><td>${badge(g.status)}</td><td>${when(g.created_at)}</td></tr>`); const rr=DB.remediation.map(r=>`<tr><td>${esc(shortId(r.id))}</td><td>${esc(shortId(r.gap_id))}</td><td><b>${esc(r.title)}</b></td><td>${esc(r.owner)}</td><td>${badge(r.status)}</td><td>${r.status!=="done"?`<button class="btn small" onclick="updateRemediation('${r.id}','in_progress')">Start</button><button class="btn small ghost" onclick="updateRemediation('${r.id}','done')">Done</button>`:""}</td></tr>`); return `<div class="panel"><h3>Gaps</h3><div class="muted" style="margin-bottom:8px">Gaps open automatically when a test fails and resolve automatically when it passes again.</div>${table(["ID","Gap","Control","Severity","Status","Created"],gr)}</div><div class="panel"><h3>Remediation</h3>${table(["ID","Gap","Task","Owner","Status","Actions"],rr)}</div>`; }

function renderPolicies(){ const rows=DB.policies.map(p=>`<tr><td>${esc(shortId(p.id))}</td><td><b>${esc(p.title)}</b></td><td>${esc(p.policy_type)}</td><td>${esc(p.version)}</td><td>${badge(p.provider||"demo")}</td><td>${badge(p.status)}</td><td><button class="btn small ghost" onclick="showPolicyVersions('${p.id}')">Versions</button>${p.status!=="approved"?`<button class="btn small" onclick="approvePolicy('${p.id}')">Approve</button>`:""}</td></tr>`); return `<div class="panel"><h3>Generate Policy</h3><div class="form-row"><input id="pol-company" placeholder="Company name"><input id="pol-type" placeholder="Policy type e.g. access control" style="min-width:240px"><button class="btn" onclick="generatePolicy()">Generate</button></div></div><div class="panel"><h3>Policies</h3>${table(["ID","Title","Type","Version","Provider","Status","Actions"],rows)}</div>`; }

function renderQuestionnaires(){ const qr=DB.questionnaires.map(q=>`<tr><td>${esc(shortId(q.id))}</td><td><b>${esc(q.customer)}</b></td><td>${esc(q.total_questions)}</td><td>${esc(q.auto_answered)}</td><td>${esc(q.needs_review)}</td><td>${badge(q.status)}</td><td><button class="btn small" onclick="processQuestionnaire('${q.id}')">Process AI</button><button class="btn small ghost" onclick="selected.questionnaire='${q.id}';render()">Answers</button></td></tr>`);
  let ah=""; if(selected.questionnaire){ const ar=DB.answers.filter(a=>a.questionnaire_id===selected.questionnaire).map(a=>`<tr><td>${esc(a.question)}</td><td>${esc(a.answer)}</td><td>${esc(a.confidence)}</td><td>${esc(a.provider||"")}</td><td>${badge(a.status)}</td><td>${["approved","rejected"].includes(a.status)?"":`<button class="btn small" onclick="answerFeedback('${a.id}','approved')">Approve</button><button class="btn small danger" onclick="answerFeedback('${a.id}','rejected')">Reject</button>`}</td></tr>`); ah=`<div class="panel"><h3>Answers</h3>${table(["Question","Answer","Confidence","Provider","Status","Feedback"],ar)}</div>`; }
  const lib=DB.answerLibrary.map(a=>`<tr><td>${esc(a.question)}</td><td>${esc(a.answer)}</td><td>${esc(a.source_type)}</td><td>${esc(a.weight)}</td></tr>`);
  return `<div class="panel"><h3>Import Questionnaire</h3><div class="form-row"><input id="q-customer" placeholder="Customer"></div><textarea id="q-questions" style="width:100%" placeholder="One question per line"></textarea><div class="form-row" style="margin-top:8px"><button class="btn" onclick="importQuestionnaire()">Import</button></div></div><div class="panel"><h3>Questionnaires</h3>${table(["ID","Customer","Total","Auto","Review","Status","Actions"],qr)}</div>${ah}<div class="panel"><h3>Answer Library</h3><div class="form-row"><input id="al-q" placeholder="Question" style="min-width:280px"><input id="al-a" placeholder="Approved answer" style="min-width:320px"><button class="btn" onclick="addLibrary()">Add</button></div>${table(["Question","Answer","Source","Weight"],lib)}</div>`; }

function chainTable(dsarId, auditor){ const c=chains[dsarId]; if(!c)return ""; const sr=c.steps.map(s=>`<tr><td><b>${esc(s.step.title)}</b></td><td>${badge(s.step.status)}</td><td>${esc(s.step.output?.note||"")}</td><td>${s.evidence.length}</td><td>${s.evidence.map(e=>`${esc(shortId(e.id))}${auditor?` <span class="muted">${esc(String(e.hash).slice(0,10))}</span>`:""}`).join(", ")||"—"}</td></tr>`); return `<div class="panel"><h3>${auditor?"Auditor Read-Only ":""}DSAR Evidence Chain — ${esc(dsarId)}</h3><div class="muted" style="margin-bottom:8px">Status: ${badge(c.workflow.status)} · SLA met: ${badge(c.workflow.sla_met)}</div>${table(["Step","Status","Note","Evidence","Evidence IDs"],sr)}</div>`; }
function renderPrivacy(){ const dr=DB.dsars.map(d=>`<tr><td>${esc(shortId(d.id))}</td><td>${esc(d.request_type)}</td><td>${esc(d.requester_email)}</td><td>${esc(d.due_date)}</td><td>${badge(d.status)}</td><td><button class="btn small" onclick="selectDsar('dsar','${d.id}')">Workflow</button>${d.status!=="completed"?`<button class="btn small ghost" onclick="advanceDsar('${d.id}')">Complete Next Step</button>`:""}</td></tr>`); return `<div class="panel"><h3>Start DSAR</h3><div class="form-row"><input id="dsar-email" placeholder="requester@example.com"><select id="dsar-type"><option value="access">Access</option><option value="deletion">Deletion</option><option value="correction">Correction</option><option value="portability">Portability</option></select><button class="btn" onclick="startDsar()">Start</button></div></div><div class="panel"><h3>DSAR Requests</h3>${table(["ID","Type","Requester","Due","Status","Actions"],dr)}</div>${selected.dsar?chainTable(selected.dsar,false):""}`; }
function renderAuditor(){ const eng=DB.auditEngagements.map(a=>`<tr><td>${esc(a.title)}</td><td>${esc(a.auditor)}</td><td>${badge(a.status)}</td></tr>`); const dr=DB.dsars.map(d=>`<tr><td>${esc(shortId(d.id))}</td><td>${esc(d.request_type)}</td><td>${esc(d.requester_email)}</td><td>${badge(d.status)}</td><td><button class="btn small" onclick="selectDsar('auditorDsar','${d.id}')">Auditor Chain</button></td></tr>`); return `<div class="panel"><h3>Audit Engagements</h3>${table(["Engagement","Auditor","Status"],eng)}</div><div class="panel"><h3>DSAR Records</h3>${table(["ID","Type","Requester","Status","Actions"],dr)}</div>${selected.auditorDsar?chainTable(selected.auditorDsar,true):""}`; }

function renderIncidents(){ const rows=DB.incidents.map(i=>`<tr><td>${esc(shortId(i.id))}</td><td><b>${esc(i.title)}</b></td><td>${badge(i.severity)}</td><td>${badge(i.status)}</td><td>${esc((i.affected_states||[]).join(", "))}</td><td><button class="btn small" onclick="triageIncident('${i.id}')">Triage</button><button class="btn small ghost" onclick="selected.incident='${i.id}';render()">Obligations</button></td></tr>`);

  return `<div class="panel"><h3>Report Incident</h3><div class="form-row"><input id="inc-title" placeholder="Title" style="min-width:260px"><select id="inc-sev"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select><input id="inc-states" placeholder="Affected states e.g. CA, TX"><input id="inc-records" placeholder="Records affected" type="number"><button class="btn" onclick="createIncident()">Create</button></div></div><div class="panel"><h3>Incidents</h3>${table(["ID","Incident","Severity","Status","States","Actions"],rows)}</div>${oh}`; }

function renderBreachMatrix(){ const rows=DB.breachMatrix.map(m=>`<tr><td><b>${esc(m.state_code)}</b></td><td>${esc(m.state_name)}</td><td>${esc(m.individual_days ?? "Expedient")}</td><td>${esc(m.regulator_notice)}</td><td>${esc(m.regulator_threshold)}</td><td>${badge(m.legal_review_required)}</td><td>${(m.history||[]).length?`<button class="btn small ghost" onclick="showObj('breachMatrix','${m.id}')">History</button>`:""}</td></tr>`); return `<div class="panel"><h3>50-State Breach Notification Matrix</h3><div class="muted" style="margin-bottom:8px">Values change only through approved Expert Review proposals. Seed values are a starting point and must be validated by counsel.</div>${table(["State","Name","Individual Days","Regulator Notice","Threshold","Legal Review",""],rows)}</div>`; }

  return `<div class="panel"><h3>Detect Changes</h3><div class="form-row"><button class="btn" onclick="crawlRadar()" ${DB.status.search_live?"":"disabled"}>Search for State Law Changes</button>${DB.status.search_live?"":'<span class="muted">Requires a search provider</span>'}</div><h3 style="margin-top:12px">Record a Change Manually</h3><div class="form-row"><input id="ru-state" placeholder="State code" style="min-width:90px;width:90px"><input id="ru-title" placeholder="Title" style="min-width:240px"><input id="ru-url" placeholder="Source URL"><input id="ru-days" placeholder="Individual days" type="number"><input id="ru-threshold" placeholder="Threshold e.g. 250_residents"><button class="btn" onclick="manualUpdate()">Record</button></div></div><div class="panel"><h3>Regulatory Updates</h3>${table(["ID","Title","State","Provider","Severity","Status","Source","Actions"],ur)}</div><div class="panel"><h3>Matrix Proposals</h3>${table(["ID","State","Current","Proposed","Status"],pr)}</div>`; }

function renderReview(){ const rows=DB.reviewItems.map(i=>`<tr><td>${esc(shortId(i.id))}</td><td>${badge(i.queue_type)}</td><td><b>${esc(i.title)}</b></td><td>${badge(i.status)}</td><td>${i.status==="pending_triage"?`<button class="btn small" onclick="reviewDecision('${i.id}','approved')">Approve</button><button class="btn small danger" onclick="reviewDecision('${i.id}','rejected')">Reject</button>`:""}<button class="btn small ghost" onclick="showObj('reviewItems','${i.id}')">Payload</button></td></tr>`); return `<div class="panel"><h3>Expert Review Console</h3>${table(["ID","Queue","Item","Status","Actions"],rows)}</div>`; }

function renderVendors(){ const vr=DB.vendors.map(v=>`<tr><td>${esc(shortId(v.id))}</td><td><b>${esc(v.title)}</b></td><td>${esc(v.category)}</td><td>${badge(v.risk_tier||"medium")}</td><td>${esc(v.data_access||"—")}</td><td>${badge(!!v.has_soc2)}</td><td>${badge(v.status)}</td><td><button class="btn small" onclick="assessVendor('${v.id}')">Assess</button></td></tr>`); const ar=DB.vendorAssessments.map(a=>`<tr><td>${esc(shortId(a.id))}</td><td>${esc((find("vendors",a.vendor_id)||{}).title||a.vendor_id)}</td><td>${esc(a.assessment_type)}</td><td><b>${esc(a.risk_score)}</b></td><td>${esc(fmt(a.factors))}</td><td>${esc(a.next_review||"—")}</td><td>${badge(a.status)}</td></tr>`);
  return `<div class="panel"><h3>Add Vendor</h3><div class="form-row"><input id="v-name" placeholder="Vendor name"><input id="v-cat" placeholder="Category"><select id="v-tier"><option>low</option><option selected>medium</option><option>high</option></select><select id="v-data"><option value="none">No customer data</option><option value="contact_data">Contact data</option><option value="customer_pii">Customer PII</option><option value="phi">PHI</option><option value="payment">Payment data</option></select><select id="v-soc2"><option value="yes">Has SOC 2</option><option value="no">No SOC 2</option></select><button class="btn" onclick="createVendor()">Add</button></div></div><div class="panel"><h3>Vendors</h3>${table(["ID","Vendor","Category","Tier","Data","SOC 2","Status","Actions"],vr)}</div><div class="panel"><h3>Assessments</h3>${table(["ID","Vendor","Type","Risk Score","Factors","Next Review","Status"],ar)}</div>`; }

function renderTrust(){ const dr=DB.trustDocs.map(d=>`<tr><td>${esc(shortId(d.id))}</td><td><b>${esc(d.title)}</b></td><td>${esc(d.access_level)}</td><td>${link(d.url)}</td><td>${badge(d.status)}</td></tr>`); const nr=DB.ndas.map(n=>`<tr><td>${esc(shortId(n.id))}</td><td>${esc(n.company)}</td><td>${esc(n.requester_email)}</td><td>${badge(n.status)}</td><td>${n.status!=="signed"?`<button class="btn small" onclick="signNda('${n.id}')">Mark Signed</button>`:"—"}</td></tr>`); return `<div class="panel"><h3>Add Trust Document</h3><div class="form-row"><input id="trust-title" placeholder="Document title"><input id="trust-url" placeholder="Document URL"><select id="trust-access"><option value="public">Public</option><option value="nda_required">NDA Required</option><option value="private">Private</option></select><button class="btn" onclick="createTrustDoc()">Add</button></div></div><div class="panel"><h3>Trust Documents</h3>${table(["ID","Title","Access","Link","Status"],dr)}</div><div class="panel"><h3>NDA Requests</h3><div class="form-row"><input id="nda-company" placeholder="Company"><input id="nda-email" placeholder="Requester email"><button class="btn ghost" onclick="requestNda()">Log Request</button></div>${table(["ID","Company","Requester","Status","Actions"],nr)}</div>`; }

function renderGlobalRadar(){ const sr=DB.regulatorySources.map(s=>`<tr><td><b>${esc(s.body_name)}</b></td><td>${esc(s.jurisdiction)}</td><td>${esc(s.category)}</td><td>${s.federal_register_agency?badge("federal_register"):s.feed_url?badge("rss"):'<span class="muted">search only</span>'}</td><td>${when(s.last_synced_at)}</td><td>${s.last_error?`<span style="color:#fca5a5">${esc(fmt(s.last_error))}</span>`:"—"}</td><td><button class="btn small ghost" onclick="editSource('${s.id}')">Edit</button></td></tr>`);
  const cr=DB.ruleChanges.map(c=>`<tr><td>${esc(c.published_at||when(c.created_at))}</td><td><b>${esc(c.title)}</b><div class="muted">${esc(fmt(c.summary))}</div></td><td>${esc(c.source_body)}</td><td>${badge(c.change_type)}</td><td>${badge(c.severity)}</td><td>${esc(c.effective_date||"—")}</td><td>${esc(c.deadline||"—")}</td><td>${badge(c.status)}</td><td>${link(c.url)} <button class="btn small" onclick="analyzeRuleChange('${c.id}')">Legal AI</button>${c.status==="detected"?`<button class="btn small ghost" onclick="queueRuleChange('${c.id}')">Review</button>`:""}</td></tr>`);
  return `<div class="panel"><h3>Actions</h3><div class="form-row"><button class="btn" onclick="syncGlobalRadar()">Sync Global Radar</button><input id="gs-query" placeholder="Search regulators e.g. EU AI Act obligations 2026" style="min-width:360px"><button class="btn ghost" onclick="globalSearch()" ${DB.status.search_live||DB.status.search_provider==="mock"?"":"disabled"}>Internet Search</button></div><div class="muted">US agencies are pulled from the Federal Register API (final and proposed rules). Other regulators use the configured search provider.</div></div><div class="panel"><h3>Rule Changes (${DB.ruleChanges.length})</h3>${table(["Published","Title","Source","Type","Severity","Effective","Comments Close","Status","Actions"],cr)}</div><div class="panel"><h3>Sources</h3>${table(["Body","Jurisdiction","Category","Channel","Last Sync","Last Error",""],sr)}</div>`; }

function renderLegalAI(){ const dr=DB.legalDocs.map(d=>`<tr><td>${when(d.created_at)}</td><td><b>${esc(d.title)}</b></td><td>${esc(d.doc_type)}</td><td>${esc(d.jurisdiction)}</td><td>${esc(d.characters)}</td><td>${link(d.source_url)}</td><td>${badge(d.status)}</td></tr>`); const ar=DB.legalAnalyses.map(a=>`<tr><td>${when(a.created_at)}</td><td>${esc(fmt(a.summary))}</td><td>${badge(String(a.provider).split(":")[0])}</td><td>${esc(a.confidence)}</td><td>${(a.obligations||[]).length}</td><td>${badge(a.status)}</td><td><button class="btn small ghost" onclick="showObj('legalAnalyses','${a.id}')">View</button>${a.status!=="planned"?`<button class="btn small" onclick="generatePlan('${a.id}')">Generate Plan</button>`:""}</td></tr>`); const or=DB.legalAnalyses.flatMap(a=>(a.obligations||[]).slice(0,8).map(o=>`<tr><td>${esc(o.text)}</td><td>${badge(o.type||"—")}</td><td>${esc(o.deadline||"—")}</td><td>${esc(o.confidence??"—")}</td></tr>`));
  return `<div class="panel"><h3>Analyze Legal / Regulatory Text</h3><div class="form-row"><input id="legal-title" placeholder="Document title"><select id="legal-type"><option value="regulation">Regulation</option><option value="guidance">Guidance</option><option value="enforcement_order">Enforcement Order</option><option value="contract">Contract</option><option value="dpa">DPA</option><option value="policy">Policy</option></select><input id="legal-jurisdiction" placeholder="Jurisdiction e.g. EU, US, UK"><input id="legal-url" placeholder="…or a source URL to fetch" style="min-width:280px"></div><textarea id="legal-text" style="width:100%;min-height:160px" placeholder="Paste regulation, guidance, contract, DPA, or enforcement text here (or leave empty and give a URL)"></textarea><div class="form-row" style="margin-top:10px"><button class="btn" onclick="uploadLegal()">Upload + Analyze</button></div></div><div class="panel"><h3>Legal Analyses</h3>${table(["Analyzed","Summary","Provider","Confidence","Obligations","Status","Actions"],ar)}</div><div class="panel"><h3>Extracted Obligations</h3>${table(["Obligation","Type","Deadline","Confidence"],or)}</div><div class="panel"><h3>Legal Documents</h3>${table(["Uploaded","Title","Type","Jurisdiction","Chars","Source","Status"],dr)}</div>`; }

function renderMarketIntel(){ const rows=DB.marketSignals.map(s=>`<tr><td>${esc(s.published_at||when(s.created_at))}</td><td><b>${esc(s.title)}</b><div class="muted">${esc(fmt(s.snippet))}</div></td><td>${esc(s.source_body)}</td><td>${esc(s.jurisdiction)}</td><td>${badge(s.sentiment)}</td><td>${badge(s.impact)}</td><td>${link(s.url)}</td></tr>`); return `<div class="panel"><h3>Actions</h3><button class="btn" onclick="syncMarket()">Sync Market Intelligence</button><div class="muted" style="margin-top:6px">Pulls regulator press/enforcement RSS feeds (SEC, FTC, CFPB, Federal Reserve, CISA, EDPB, FCA…) and, for sources without a feed, the configured search provider. Edit feeds in Global Radar → Sources.</div></div><div class="panel"><h3>Market Signals (${DB.marketSignals.length})</h3>${table(["Published","Title","Source","Jurisdiction","Sentiment","Impact","URL"],rows)}</div>`; }

function renderImplementationPlans(){ const rows=DB.implPlans.map(p=>`<tr><td>${when(p.created_at)}</td><td><b>${esc(p.title)}</b></td><td>${esc(p.horizon)}</td><td>${esc(p.target_date||"—")}</td><td>${(p.tasks||[]).map(t=>`• ${esc(t.title)} <span class="muted">(${esc(t.owner_role)})</span>`).join("<br>")}</td><td>${badge(p.status)}</td></tr>`); return `<div class="panel"><h3>Implementation Plans</h3><div class="muted" style="margin-bottom:8px">Generated from Legal AI analyses.</div>${table(["Created","Objective","Horizon","Target","Tasks","Status"],rows)}</div>`; }

function renderReports(){ const rows=DB.reports.map(r=>`<tr><td>${esc(shortId(r.id))}</td><td>${esc(r.period)}</td><td><b>${esc(r.payload?.overall_readiness_score)}%</b></td><td>${esc(r.payload?.open_gaps)}</td><td>${esc(fmt(r.payload?.top_risks))}</td><td><button class="btn small ghost" onclick="showObj('reports','${r.id}')">View</button></td></tr>`); return `<div class="panel"><h3>Executive Reporting</h3><button class="btn" onclick="generateReport()">Generate Executive Report</button><div class="muted" style="margin-top:6px">Readiness = share of control tests currently passing.</div></div><div class="panel"><h3>Reports</h3>${table(["ID","Period","Readiness","Open Gaps","Top Risks","Actions"],rows)}</div>`; }

let MCP_TOOLS=[];
function renderMcp(){ if(!MCP_TOOLS.length){ api("GET","/v1/mcp/tools").then(t=>{MCP_TOOLS=t; if(screen==="mcp")render();}); } const tr=MCP_TOOLS.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.description)}</td><td>${badge(t.scope)}</td></tr>`); const opts=MCP_TOOLS.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join(""); return `<div class="panel"><h3>MCP Tool Call</h3><div class="form-row"><select id="mcp-tool">${opts}</select><textarea id="mcp-args" placeholder='{"connector":"aws"}'></textarea><button class="btn" onclick="callMcp()">Call Tool</button></div><div class="muted">Endpoint: <code>POST /v1/mcp/call {"tool": "...", "arguments": {...}}</code></div></div><div class="panel"><h3>MCP Tools</h3>${table(["Tool","Description","Scope"],tr)}</div>`; }

function renderBrain(){ const m=DB.metrics; const rows=DB.events.slice(0,50).map(e=>`<tr><td>${new Date(e.created_at).toLocaleTimeString()}</td><td>${esc(e.flow)}</td><td>${esc(e.step)}</td><td>${badge(e.status)}</td><td class="muted">${esc(fmt(e.metadata))}</td><td><button class="btn small ghost" onclick="openFlow('${esc(e.correlation_id)}')">Trace</button></td></tr>`); return `<div class="cards"><div class="card"><div class="label">Telemetry Events</div><div class="value">${m.telemetry_events}</div></div><div class="card"><div class="label">Controls</div><div class="value">${m.control}</div></div><div class="card"><div class="label">Evidence</div><div class="value">${m.evidence}</div></div><div class="card"><div class="label">Legal Analyses</div><div class="value">${m.legal_analysis}</div></div></div><div class="grid2"><div class="panel"><h3>Event Stream</h3>${table(["Time","Flow","Step","Status","Metadata","Trace"],rows)}</div><div class="panel"><h3>Anomaly Detection</h3><pre>${esc(JSON.stringify(DB.anomalies,null,2))}</pre></div></div>`; }

function renderPricing(){ const rows=DB.entitlements.map(e=>`<tr><td><b>${esc(e.module)}</b></td><td>${badge(!!e.enabled)}</td><td>${esc(e.limit_value ?? "—")}</td><td><button class="btn small ghost" onclick="toggleEntitlement('${e.id}',${!e.enabled})">${e.enabled?"Disable":"Enable"}</button></td></tr>`); return `<div class="panel"><h3>Plan Entitlements</h3>${table(["Module","Enabled","Limit","Actions"],rows)}</div>`; }

const SCREENS = {dashboard:renderDashboard,integrations:renderIntegrations,frameworks:renderFrameworks,controls:renderControls,evidence:renderEvidence,tests:renderTests,gaps:renderGaps,policies:renderPolicies,questionnaires:renderQuestionnaires,privacy:renderPrivacy,auditor:renderAuditor,incidents:renderIncidents,breach:renderBreachMatrix,radar:renderRadar,review:renderReview,vendors:renderVendors,trust:renderTrust,globalRadar:renderGlobalRadar,legalAI:renderLegalAI,marketIntel:renderMarketIntel,implementationPlans:renderImplementationPlans,reports:renderReports,mcp:renderMcp,brain:renderBrain,pricing:renderPricing};

window.addEventListener("hashchange", ()=>{ const s=location.hash.slice(1); if(s!==screen && SCREENS[s]){ screen=s; render(); } });
refresh();
</script>
</body>
</html>
