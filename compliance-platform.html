<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Compliance Platform</title>
<style>
:root{--bg:#fff;--sf:#fafafa;--mu:#f4f4f5;--mu2:#e4e4e7;--fg:#18181b;--fg2:#52525b;--fg3:#71717a;--bd:#e4e4e7;
--pass:#16a34a;--fail:#dc2626;--warn:#d97706;--info:#2563eb;--draft:#a16207;--acc:#4f46e5}
*{box-sizing:border-box;margin:0;padding:0}html{font-size:13px}
body{font:13px/1.55 Inter,-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
a{color:inherit;text-decoration:none;cursor:pointer}button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px}.tab{font-variant-numeric:tabular-nums}
.shell{display:flex;min-height:100vh}
.sb{width:225px;flex-shrink:0;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#fff}
.logo{height:50px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--bd);padding:0 16px;font-weight:650;font-size:15px}
.logo .hx{width:27px;height:27px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:#fff}
.nav{flex:1;overflow-y:auto;padding:8px 10px 16px}
.ng{margin-top:12px}.nl{font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.09em;color:var(--fg3);padding:0 9px 5px}
.nav a{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:7px;color:var(--fg2);margin-bottom:1px;font-size:13px}
.nav a:hover{background:var(--mu)}.nav a.on{background:var(--mu2);color:var(--fg);font-weight:550}
.nav .ic{width:16px;text-align:center;color:var(--fg3)}.nav .bd{margin-left:auto;background:var(--acc);color:#fff;border-radius:99px;padding:0 6px;font-size:10px;font-weight:600}
.main{flex:1;min-width:0}
.tb{height:50px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;background:#fff;z-index:20}
.search{flex:1;max-width:300px;display:flex;align-items:center;gap:8px;background:var(--mu);border:1px solid var(--bd);border-radius:8px;padding:6px 11px;color:var(--fg3)}
.tb .sp{flex:1}.av{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:650}
.ct{padding:20px;max-width:1250px;margin:0 auto}
h1{font-size:16px;font-weight:650}h2{font-size:14px;font-weight:600}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ps{color:var(--fg3);font-size:12px;margin-top:2px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.cti{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);padding:10px 14px;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3)}
.cb{padding:14px}
.g{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.gm{grid-template-columns:1fr 350px}
@media(max-width:1000px){.g2,.g3,.g4,.gm{grid-template-columns:1fr}.sb{display:none}}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:550}
.b-pass{color:var(--pass);background:#16a34a1a;border-color:#16a34a4d}.b-fail{color:var(--fail);background:#dc26261a;border-color:#dc26264d}
.b-warn{color:var(--warn);background:#d977061a;border-color:#d977064d}.b-info{color:var(--info);background:#2563eb1a;border-color:#2563eb4d}
.b-draft{color:var(--draft);background:#a162071a;border-color:#a1620766;border-style:dashed}.b-zinc{color:var(--fg3);background:var(--mu);border-color:var(--bd)}
.btn{display:inline-flex;align-items:center;gap:6px;height:31px;border-radius:7px;padding:0 13px;font-size:12.5px;font-weight:550;border:1px solid transparent}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-p{background:#18181b;color:#fff}.btn-o{border-color:var(--bd);background:#fff}.btn-o:hover{background:var(--mu)}
.btn-s{background:#16a34a1a;color:var(--pass);border-color:#16a34a4d}.btn-d{background:#dc26261a;color:var(--fail);border-color:#dc26264d}
.muted{color:var(--fg3)}.sm{font-size:12px}.xs{font-size:11px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3);padding:8px 14px;border-bottom:1px solid var(--bd)}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}.tbl tr:last-child td{border-bottom:none}.tbl tr:hover td{background:#fafafa}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--bd)}.row:last-child{border-bottom:none}.row:hover{background:#fafafa}
.ring{position:relative;display:inline-grid;place-items:center}.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;text-align:center}.ring .c b{font-size:19px;font-weight:650;display:block}.ring .c span{font-size:10px;color:var(--fg3)}
.frow{display:flex;gap:9px;align-items:flex-start;padding:7px 14px;border-bottom:1px solid var(--bd);font-size:12px}.frow:last-child{border-bottom:none}.frow .t{color:var(--fg3);width:44px;flex-shrink:0}
.chain{border:1px solid var(--bd);border-left:4px solid var(--pass);border-radius:8px;background:#fff;margin-bottom:6px}
.chain.f{border-left-color:var(--fail)}
.chead{display:flex;align-items:center;gap:9px;padding:8px 12px;width:100%;text-align:left;cursor:pointer}
.qbar{display:flex;align-items:center;gap:9px;font-size:12px;margin-bottom:8px}.qbar .tr{flex:1;height:8px;background:var(--mu);border-radius:99px;overflow:hidden}.qbar .fl{height:100%;border-radius:99px}
.subsys{display:flex;align-items:center;gap:10px;font-size:12px;padding:7px 0;border-bottom:1px solid var(--bd)}.subsys:last-child{border-bottom:none}
.subsys .tr{flex:1;height:6px;background:var(--mu);border-radius:99px;overflow:hidden}.subsys .fl{height:100%;border-radius:99px}
.steps{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:10px 0}.stp{border-radius:6px;padding:2px 8px;font-size:10.5px;font-weight:600}
.stp.on{background:#2563eb1a;color:var(--info)}.stp.off{background:var(--mu);color:var(--fg3)}
.clock{font-family:ui-monospace,monospace;font-weight:650;font-size:14px}.clock.crit{color:var(--fail)}.clock.wr{color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.pass{background:var(--pass)}.dot.fail{background:var(--fail)}.dot.warn{background:var(--warn)}.dot.info{background:var(--info)}.dot.zinc{background:var(--fg3)}
.rev{display:grid;grid-template-columns:270px 1fr 290px;height:calc(100vh - 190px);border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#fff}
@media(max-width:1000px){.rev{grid-template-columns:1fr;height:auto}}
.rev .pn{overflow-y:auto}.rev .lf{border-right:1px solid var(--bd);background:var(--sf)}.rev .cn{padding:20px}.rev .rt{border-left:1px solid var(--bd);padding:15px;background:var(--sf)}
.qi{display:flex;gap:8px;width:100%;padding:7px 12px;text-align:left;font-size:12px;align-items:center;border-bottom:1px solid var(--bd)}.qi:hover{background:var(--mu)}.qi.on{background:var(--mu2);font-weight:550}
.gh{position:sticky;top:0;background:var(--sf);padding:7px 12px;font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3)}
.src{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:11px;margin-bottom:9px}.src .ex{margin-top:7px;border-left:2px solid var(--mu2);padding-left:9px;font-size:12px;color:var(--fg2)}
.ov{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-start;justify-content:center;padding:16px;padding-top:8vh;z-index:50}
.mo{background:#fff;border:1px solid var(--bd);border-radius:12px;width:100%;max-width:540px;box-shadow:0 20px 50px #0003;max-height:85vh;overflow-y:auto}
.mo .mh{border-bottom:1px solid var(--bd);padding:12px 16px;font-weight:600}.mo .mb{padding:16px}
kbd{border:1px solid var(--bd);background:var(--mu);border-radius:4px;padding:0 5px;font-size:10px;color:var(--fg3)}
.passp{font-family:ui-monospace,monospace;font-size:15px;background:var(--mu);border:1px solid var(--bd);border-radius:9px;padding:12px;letter-spacing:.04em;text-align:center}
.flash{border:1px solid #2563eb4d;background:#2563eb0d;border-radius:8px;padding:8px 13px;font-size:12px;color:var(--info);margin-bottom:12px}
.empty{padding:30px;text-align:center;color:var(--fg3)}
.err{color:var(--fail);padding:20px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px}
</style>
</head>
<body>
<div class="shell">
<aside class="sb">
<div class="logo"><span class="hx">⬢</span> Compliance <span class="badge b-zinc" style="margin-left:auto">v2</span></div>
<nav class="nav" id="nav"></nav>
</aside>
<div class="main">
<div class="tb"><div class="search">🔍 <span>Search…</span><kbd style="margin-left:auto">⌘K</kbd></div><div class="sp"></div><span class="xs muted">Acme Corp</span><div class="av">SC</div></div>
<div class="ct" id="view"><div class="empty">Loading…</div></div>
</div>
</div>
<div id="modal"></div>
<script>
/* Show any error on-page instead of going blank */
window.addEventListener('error',function(e){
var v=document.getElementById('view');
if(v)v.innerHTML='<div class="err">JS ERROR: '+(e&&e.message?e.message:'unknown')+'</div>';
});
try{
/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function rhex(){return Math.random().toString(16).slice(2,10);}
function dstr(d){return new Date(d).toLocaleDateString([],{month:'short',day:'numeric'});}
function tstr(d){return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function rel(d){var s=(Date.now()-new Date(d))/1000;return s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago';}
function B(t,x){return '<span class="badge '+t+'">'+x+'</span>';}
var DAY=864e5;
/* ---------- mock data ---------- */
var FW={SOC2:{p:87,t:46,d:40,n:'SOC 2'},ISO27001:{p:74,t:93,d:69,n:'ISO 27001'},HIPAA:{p:81,t:42,d:34,n:'HIPAA'},GDPR:{p:68,t:25,d:17,n:'GDPR'}};
var CONTROLS=[
{slug:'access.adminMfa',name:'MFA for Privileged Accounts',state:'PASSING',grade:'A',score:96,st:'IMPLEMENTED',reqs:[['S2','CC6.1'],['ISO','8.5'],['HIP','164.312(d)'],['GDPR','Art.32']],desc:'All administrative and privileged accounts enforce MFA.'},
{slug:'access.offboarding',name:'Offboarding Within 24 Hours',state:'FAILING',grade:'C',score:58,st:'IMPLEMENTED',reqs:[['S2','CC6.2'],['ISO','5.11']],desc:'Terminated personnel lose all access within 24h.'},
{slug:'crypto.atRest',name:'Encryption at Rest',state:'PASSING',grade:'A',score:94,st:'IMPLEMENTED',reqs:[['S2','CC6.1'],['ISO','8.24']],desc:'All production data stores encrypt at rest.'},
{slug:'change.branchProtection',name:'Protected Mainline & Code Review',state:'PASSING',grade:'B',score:82,st:'IMPLEMENTED',reqs:[['S2','CC8.1'],['ISO','8.32']],desc:'Default branches protected; review + CI required.'},
{slug:'vendor.riskProgram',name:'Vendor Risk Management',state:'STALE',grade:'D',score:44,st:'IN_PROGRESS',reqs:[['S2','CC9.2'],['ISO','5.19'],['GDPR','Art.28']],desc:'Vendors tiered, reviewed on cadence.'}];
var CHAINS={};
CONTROLS.forEach(function(c){var n=5,arr=[];for(var i=1;i<=n;i++){arr.push({seq:i,st:(c.slug==='access.offboarding'&&i===1)?'FAIL':'PASS',ch:rhex(),at:Date.now()-i*2*DAY});}arr.reverse();CHAINS[c.slug]=arr;});
var TASKS=[
{t:'Deprovision terminated employees immediately',p:'CRITICAL',s:'OPEN',src:'test',re:true},
{t:'Verify EU subject facts for GDPR Art.33 clock',p:'HIGH',s:'OPEN',src:'incident'},
{t:'Evidence quality below gate: vendor.riskProgram',p:'HIGH',s:'OPEN',src:'gap'},
{t:'Stripe annual vendor review',p:'MEDIUM',s:'IN_PROGRESS',src:'vendor'},
{t:'Rotate Okta API token',p:'MEDIUM',s:'DONE',src:'manual',v:true},
{t:'Upload Q2 access-review evidence',p:'MEDIUM',s:'DONE',src:'gap'}];
var POLICIES=[{t:'Access Control Policy',v:3,st:'APPROVED',ai:false},{t:'Information Security Policy',v:1,st:'IN_REVIEW',ai:true},{t:'Encryption Policy',v:2,st:'APPROVED',ai:false},{t:'Incident Response Plan',v:2,st:'APPROVED',ai:false}];
var QUEST=[
{q:'Is MFA required for administrative access?',st:'AUTO_DRAFTED',c:0.96,a:'Yes. All administrative and privileged accounts enforce MFA, verified daily against Okta (12/12 enrolled).',ci:[{t:'policy',n:'Access Control Policy v1',ex:'Privileged accounts enforce MFA [CC6.1].'}]},
{q:'How long do you retain audit logs?',st:'AUTO_DRAFTED',c:0.91,a:'Audit logs retained 12 months; 90 days immediately queryable.',ci:[{t:'policy',n:'Logging Policy v2'}]},
{q:'Do you have a SOC 2 Type II report?',st:'AUTO_DRAFTED',c:0.89,a:'Our most recent SOC 2 Type II report covers the period ending Dec 2024, available under NDA.',ci:[]},
{q:'Where is customer data stored geographically?',st:'AI_DRAFTED',c:0.42,a:null,ci:[{t:'gap',n:'No data-residency statement found'}]},
{q:'Describe your incident response process.',st:'STALE',c:0.88,a:'Seven-state machine; per-jurisdiction notification deadlines.',ci:[{t:'policy',n:'Incident Response Plan v2'}]}];
var VENDORS=[{n:'Stripe',tier:'CRITICAL',score:88,cert:'SOC2 exp 28d'},{n:'Datadog',tier:'HIGH',score:61,cert:'ISO expired'},{n:'Acme Legal',tier:'LOW',score:74,cert:'—'}];
var DSARS=[{type:'ACCESS',st:'VERIFIED',due:Date.now()+12*DAY},{type:'ERASE',st:'VERIFYING',due:Date.now()+28*DAY},{type:'ACCESS',st:'REVIEW',due:Date.now()+3*DAY},{type:'PORT',st:'DELIVERED',due:Date.now()+5*DAY},{type:'ACCESS',st:'REVIEW',due:Date.now()-2*DAY,over:true}];
var INC={title:'Suspected credential stuffing on customer portal',sev:'HIGH',st:'TRIAGE',obs:[{a:'GDPR_DPA',s:'GDPR Art.33',dl:Date.now()+41*36e5},{a:'AG_US-CO',s:'C.R.S. 6-1-716',dl:Date.now()+29*DAY},{a:'HHS',s:'HIPAA 164.408',dl:Date.now()+59*DAY}]};
var RADAR=[{j:'US-CO',sum:'SB 24-10 amends breach deadline 30d to 21d (biometric)',st:'PENDING_REVIEW'},{j:'EU',sum:'EDPB guidance on Art.33 without undue delay',st:'VERIFIED'},{j:'US-NY',sum:'DFS Part 500 amendment - 72h threshold lowered',st:'APPLIED'}];
var SUBSYS={api:0.99,mcp:1,connectors:0.92,check_runner:0.97,llm:1,temporal:1,sla_timers:0.98,review_queue:0.95,ethics_service:1};
var RIAJ=[{c:'US-CO',n:'Colorado',rel:0.9},{c:'US-CA',n:'California',rel:0.9},{c:'EU',n:'European Union',rel:0.85},{c:'GB',n:'United Kingdom',rel:0.9}];
var REVIEWQ=[{q:'FRAMEWORK_CONTENT',t:'SOC2 CC7.4 - Incident response',p:'HIGH'},{q:'MATRIX_PROPOSAL',t:'US-CO: SB 24-10 amends breach rule',p:'CRITICAL'},{q:'REG_CHANGE',t:'US-NY: DFS Part 500 72h threshold',p:'HIGH'},{q:'RIA_DRIFT',t:'RIA extraction drift: rejection_rate 0.34',p:'CRITICAL'}];
var TRUST={slug:'acme',sections:[{t:'Security program',b:'Unified controls across SOC 2, ISO 27001, HIPAA and GDPR, continuously tested with hash-chained evidence.'},{t:'Penetration testing',b:'Annual third-party penetration test; latest report available under NDA.'},{t:'Privacy',b:'DSARs handled within Art. 12 timelines; DPO reachable at dpo@acme.test.'}],docs:[{n:'Security Overview (public)',pub:true},{n:'SOC 2 Type II Report (NDA)',pub:false}]};
/* ---------- live feed ---------- */
var POOL=[['control.test.passed','✅'],['control.test.failed','❌'],['evidence.created','🧾'],['gap.detected','⚠️'],['policy.published','📄'],['regchange.applied','📡'],['trust.nda.signed','🛡'],['privacy_request.created','⛨']];
var feed=[];
function pushFeed(){var p=POOL[Math.floor(Math.random()*POOL.length)];feed.unshift({t:p[0],i:p[1],at:new Date()});feed=feed.slice(0,30);var el=document.getElementById('feedList');if(el)el.innerHTML=feedRows();}
function feedRows(){return feed.map(function(e){return '<div class="frow"><span class="t">'+tstr(e.at)+'</span><span>'+e.i+'</span><span style="flex:1">'+e.t+'</span></div>';}).join('');}
/* ---------- shared render bits ---------- */
function ring(p,s){s=s||112;var r=s/2-9,c=2*Math.PI*r,col=p>=80?'var(--pass)':p>=50?'var(--warn)':'var(--fail)';
return '<div class="ring" style="width:'+s+'px;height:'+s+'px"><svg width="'+s+'" height="'+s+'"><circle cx="'+(s/2)+'" cy="'+(s/2)+'" r="'+r+'" stroke="var(--mu2)" stroke-width="9" fill="none"/><circle cx="'+(s/2)+'" cy="'+(s/2)+'" r="'+r+'" stroke="'+col+'" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-p/100))+'"/></svg><div class="c"><b>'+p+'%</b></div></div>';}
function fmtClock(ms){if(ms<=0)return'OVERDUE';var h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return h>24?Math.floor(h/24)+'d '+h%24+'h':('0'+h).slice(-2)+':'+('0'+m).slice(-2)+':'+('0'+s).slice(-2);}
/* ---------- screens ---------- */
function home(){var out='<div class="ph"><div><h1>Good day, Sarah</h1><div class="ps">'+new Date().toDateString()+'</div></div><span class="badge b-pass"><span class="dot pass"></span> Brain live</span></div>';
out+='<div class="g g4" style="margin-bottom:12px">';
Object.keys(FW).forEach(function(k){var f=FW[k];out+='<div class="card" style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px">'+ring(f.p)+'<div style="text-align:center"><div style="font-weight:550">'+f.n+'</div><div class="xs muted">'+f.d+'/'+f.t+' satisfied</div></div>'+(f.p<75?B('b-warn',(f.t-f.d)+' gaps'):'')+'</div>';});
out+='</div><div class="g gm"><div class="g g3" style="align-content:start">';
out+='<div class="card cb"><div class="xs" style="font-weight:650;text-transform:uppercase;color:var(--fg3);margin-bottom:8px">Tasks</div>'+[['Critical',3],['High',5],['Medium',9],['Low',4]].map(function(x){return '<div class="qbar"><span style="flex:1">'+x[0]+'</span><b class="tab">'+x[1]+'</b></div>';}).join('')+'<a href="#/tasks" class="sm" style="color:var(--info)">View all →</a></div>';
out+='<div class="card cb"><div class="xs" style="font-weight:650;text-transform:uppercase;color:var(--fg3);margin-bottom:8px">Evidence quality</div>'+[['A',62,'var(--pass)'],['B',28,'var(--pass)'],['C',7,'var(--warn)'],['D',2,'var(--warn)'],['F',1,'var(--fail)']].map(function(x){return '<div class="qbar"><span style="width:12px;font-weight:650">'+x[0]+'</span><div class="tr"><div class="fl" style="width:'+x[1]+'%;background:'+x[2]+'"></div></div><span class="tab" style="width:24px;text-align:right">'+x[1]+'</span></div>';}).join('')+'</div>';
out+='<div class="card cb"><div class="xs" style="font-weight:650;text-transform:uppercase;color:var(--fg3);margin-bottom:8px">Reg radar</div>'+RADAR.map(function(r){return '<div class="sm" style="margin-bottom:7px"><span class="muted xs">'+r.j+' · </span>'+esc(r.sum.slice(0,44))+'…</div>';}).join('')+'<a href="#/radar" class="sm" style="color:var(--info)">All →</a></div>';
out+='</div><div class="card" style="display:flex;flex-direction:column;max-height:420px"><div class="cti">Live activity <span class="xs muted">streaming</span></div><div id="feedList" style="overflow-y:auto;flex:1">'+feedRows()+'</div><a href="#/brain" style="border-top:1px solid var(--bd);padding:9px;text-align:center;font-size:12px;color:var(--fg3)">View Brain →</a></div></div>';
return out;}
function controls(){var out='<div class="ph"><h1>Controls</h1><span class="xs muted">one control → four frameworks</span></div><div class="card"><table class="tbl"><thead><tr><th>Control</th><th>Frameworks</th><th>Test</th><th>Grade</th><th></th></tr></thead><tbody>';
CONTROLS.forEach(function(c){out+='<tr><td style="font-weight:550">'+c.name+'</td><td>'+c.reqs.map(function(r){return '<span class="badge b-zinc" style="margin-right:3px">'+r[0]+' '+r[1]+'</span>';}).join('')+'</td><td>'+B({PASSING:'b-pass',FAILING:'b-fail',STALE:'b-warn'}[c.state],c.state)+'</td><td>'+B(c.score>=75?'b-pass':c.score>=50?'b-warn':'b-fail',c.grade)+'</td><td><a href="#/controls/'+c.slug+'"><button class="btn btn-o">Open</button></a></td></tr>';});
